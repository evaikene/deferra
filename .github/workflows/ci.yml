name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 1G

jobs:
  ubuntu:
    name: Ubuntu
    runs-on: ubuntu-26.04

    steps:
      - name: Check out sources
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            ccache \
            catch2 \
            cmake \
            g++ \
            libcurl4-openssl-dev \
            libfmt-dev \
            libssl-dev \
            libsqlite3-dev \
            ninja-build \
            nlohmann-json3-dev

      - name: Restore ccache
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-v2-ubuntu-26.04-${{ github.sha }}
          restore-keys: |
            ccache-v2-ubuntu-26.04-

      - name: Configure
        run: cmake -S . -B .bld -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: |
          ccache --zero-stats
          cmake --build .bld
          ccache --show-stats

      - name: Save ccache
        if: github.event_name == 'push'
        uses: actions/cache/save@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-v2-ubuntu-26.04-${{ github.sha }}

      - name: Test
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            ctest --test-dir .bld/test --output-on-failure -LE '^distribution$'
          else
            ctest --test-dir .bld/test --output-on-failure
          fi

      - name: Prepare reusable JobU SDK
        run: tools/ci/prepare-sdk .bld .bld/ci-artifacts

      - name: Upload JobU SDK
        uses: actions/upload-artifact@v4
        with:
          name: jobu-sdk-ubuntu-26.04-x64
          path: .bld/ci-artifacts/jobu-sdk.tar.gz
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  alpine:
    name: Alpine
    runs-on: ubuntu-26.04
    container: alpine:3.24
    env:
      # This disposable root container explicitly exercises unsafe root CLI execution.
      # The fixture also launches a separate daemon without the override to prove denial.
      JOBU_TEST_ALLOW_ROOT_CLI: "1"

    steps:
      # GitHub's JavaScript actions need a glibc compatibility layer on musl.
      - name: Install tools and dependencies
        run: |
          apk add --no-cache \
            ccache \
            tar \
            catch2-3 \
            cmake \
            curl-dev \
            fmt-dev \
            g++ \
            gcompat \
            git \
            nlohmann-json \
            openssl-dev \
            samurai \
            sqlite-dev \
            tzdata

      - name: Check out sources
        uses: actions/checkout@v5

      - name: Restore ccache
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-v2-alpine-3.24-${{ github.sha }}
          restore-keys: |
            ccache-v2-alpine-3.24-

      - name: Configure
        run: cmake -S . -B .bld -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: |
          ccache --zero-stats
          cmake --build .bld
          ccache --show-stats

      - name: Save ccache
        if: github.event_name == 'push'
        uses: actions/cache/save@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-v2-alpine-3.24-${{ github.sha }}

      - name: Test
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            ctest --test-dir .bld/test --output-on-failure -LE '^distribution$'
          else
            ctest --test-dir .bld/test --output-on-failure
          fi

      - name: Prepare reusable JobU SDK
        run: tools/ci/prepare-sdk .bld .bld/ci-artifacts

      - name: Upload JobU SDK
        uses: actions/upload-artifact@v4
        with:
          name: jobu-sdk-alpine-3.24-x64
          path: .bld/ci-artifacts/jobu-sdk.tar.gz
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  php-ubuntu:
    name: PHP ${{ matrix.php }} / Ubuntu 26.04
    needs: ubuntu
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        # Single source for both distributions. Remove 8.2 here when its public
        # packages leave the repository; no scripts or second list need editing.
        php: &php-versions ['8.2', '8.3', '8.4', '8.5', '8.6']

    steps:
      - name: Check out sources
        uses: actions/checkout@v5

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            ca-certificates curl gnupg ccache catch2 cmake g++ ninja-build python3 libfmt-dev

      - name: Download same-run native SDK
        uses: actions/download-artifact@v4
        with:
          name: jobu-sdk-ubuntu-26.04-x64
          path: .bld/native-sdk

      - name: Extract native SDK
        run: tar -xzf .bld/native-sdk/jobu-sdk.tar.gz -C .bld/native-sdk

      - name: Install selected ZendPHP
        env:
          PHP_VERSION: ${{ matrix.php }}
        run: sudo tools/ci/install-zendphp ubuntu "$PHP_VERSION"

      - name: Identify compiler
        id: compiler
        run: echo "version=$(c++ -dumpfullversion)" >> "$GITHUB_OUTPUT"

      - name: Restore ccache
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-v2-php-ubuntu-26.04-${{ matrix.php }}-${{ steps.compiler.outputs.version }}-${{ github.sha }}
          restore-keys: |
            ccache-v2-php-ubuntu-26.04-${{ matrix.php }}-${{ steps.compiler.outputs.version }}-

      - name: Build and test PHP helper and JobU module
        env:
          PHP_VERSION: ${{ matrix.php }}
        run: tools/ci/php-test "$PHP_VERSION" "/usr/bin/php-config${PHP_VERSION}-zend" .bld/php .bld/native-sdk/sdk

      - name: Save ccache
        if: github.event_name == 'push'
        uses: actions/cache/save@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-v2-php-ubuntu-26.04-${{ matrix.php }}-${{ steps.compiler.outputs.version }}-${{ github.sha }}

      - name: Upload PHP test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: php-ubuntu-26.04-${{ matrix.php }}-tests
          path: |
            .bld/php/test/results.xml
            .bld/php/test/Testing/Temporary/LastTest.log
            .bld/php/test/php-cxx/build-contract-fixture/*.log
            .bld/php/compile_commands.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  php-alpine:
    name: PHP ${{ matrix.php }} / Alpine 3.24
    needs: alpine
    runs-on: ubuntu-26.04
    container: alpine:3.24
    strategy:
      fail-fast: false
      matrix:
        php: *php-versions

    steps:
      - name: Install build tools
        run: |
          apk add --no-cache ca-certificates curl ccache catch2-3 cmake g++ \
            gcompat git samurai python3 tar tzdata fmt-dev

      - name: Check out sources
        uses: actions/checkout@v5

      - name: Download same-run native SDK
        uses: actions/download-artifact@v4
        with:
          name: jobu-sdk-alpine-3.24-x64
          path: .bld/native-sdk

      - name: Extract native SDK
        run: tar -xzf .bld/native-sdk/jobu-sdk.tar.gz -C .bld/native-sdk

      - name: Install selected ZendPHP
        env:
          PHP_VERSION: ${{ matrix.php }}
        run: tools/ci/install-zendphp alpine "$PHP_VERSION"

      - name: Identify compiler
        id: compiler
        run: echo "version=$(c++ -dumpfullversion)" >> "$GITHUB_OUTPUT"

      - name: Restore ccache
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-v2-php-alpine-3.24-${{ matrix.php }}-${{ steps.compiler.outputs.version }}-${{ github.sha }}
          restore-keys: |
            ccache-v2-php-alpine-3.24-${{ matrix.php }}-${{ steps.compiler.outputs.version }}-

      - name: Build and test PHP helper and JobU module
        env:
          PHP_VERSION: ${{ matrix.php }}
        run: |
          compact=$(printf '%s' "$PHP_VERSION" | tr -d .)
          tools/ci/php-test "$PHP_VERSION" "/usr/bin/php-config${compact}zend" .bld/php .bld/native-sdk/sdk

      - name: Save ccache
        if: github.event_name == 'push'
        uses: actions/cache/save@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-v2-php-alpine-3.24-${{ matrix.php }}-${{ steps.compiler.outputs.version }}-${{ github.sha }}

      - name: Upload PHP test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: php-alpine-3.24-${{ matrix.php }}-tests
          path: |
            .bld/php/test/results.xml
            .bld/php/test/Testing/Temporary/LastTest.log
            .bld/php/test/php-cxx/build-contract-fixture/*.log
            .bld/php/compile_commands.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
