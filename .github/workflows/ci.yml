name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ubuntu:
    name: Ubuntu
    runs-on: ubuntu-latest

    steps:
      - name: Check out sources
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            ccache \
            catch2 \
            cmake \
            g++ \
            libcurl4-openssl-dev \
            libfmt-dev \
            libssl-dev \
            libsqlite3-dev \
            ninja-build \
            nlohmann-json3-dev

      - name: Configure
        run: cmake -S . -B .bld -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: |
          ccache --zero-stats
          cmake --build .bld
          ccache --show-stats

      - name: Test
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            ctest --test-dir .bld/test --output-on-failure -LE '^distribution$'
          else
            ctest --test-dir .bld/test --output-on-failure
          fi

  alpine:
    name: Alpine
    runs-on: ubuntu-latest
    container: alpine:latest
    env:
      # This disposable root container explicitly exercises unsafe root CLI execution.
      # The fixture also launches a separate daemon without the override to prove denial.
      JOBU_TEST_ALLOW_ROOT_CLI: "1"

    steps:
      # GitHub's JavaScript actions need a glibc compatibility layer on musl.
      - name: Install tools and dependencies
        run: |
          apk add --no-cache \
            ccache \
            catch2-3 \
            cmake \
            curl-dev \
            fmt-dev \
            g++ \
            gcompat \
            git \
            nlohmann-json \
            openssl-dev \
            samurai \
            sqlite-dev \
            tzdata

      - name: Check out sources
        uses: actions/checkout@v5

      - name: Configure
        run: cmake -S . -B .bld -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: |
          ccache --zero-stats
          cmake --build .bld
          ccache --show-stats

      - name: Test
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            ctest --test-dir .bld/test --output-on-failure -LE '^distribution$'
          else
            ctest --test-dir .bld/test --output-on-failure
          fi
